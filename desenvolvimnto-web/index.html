<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estacionamento</title>
  <link rel="stylesheet" href="style.css">
  <script src="javascript.js" defer></script>
</head>
<body>
  <main div="reservaVaga">
  <H1>Reserva da Vaga</H1>
    <form id="formularioReserva">
      <label for="placaVeiculo">Placa do Veículo:</label>
      <input type="text" id="placaVeiculo" name="placaVeiculo" required></br>
      <label for="nomeProprietario">Nome do Proprietário:</label>
      <input type="text" id="nomeProprietario" name="nomeProprietario" required></br>
      <label for="numeroApartamento">Número do Apartamento:</label>
      <input type="text" id="numeroApartamento" name="numeroApartamento" required></br>
      <label for="blocoApartamento">Bloco do Apartamento:</label>
      <input type="text" id="blocoApartamento" name="blocoApartamento" required></br>
      <label for="modeloVeiculo">Modelo do veículo:</label>
      <input type="text" id="modeloVeiculo" name="modeloVeiculo" required></br>
      <label for="corVeiculo">Cor do veículo:</label>
      <input type="text" id="corVeiculo" name="corVeiculo" required></br>
      <label for="numeroVaga">Número da vaga de estacionamento:</label>
      <input type="text" id="numeroVaga" name="numeroVaga" required></br>
      
      <button type="submit">Reservar Vaga</button>
    </form>
  </main>
  <aside>
    <h2 id="vagasDisponiveis">Vagas Disponíveis</h2>
      <ul id="listaVagas">
        <li>vaga1</li>
        <li>vaga2</li>
        <li>vaga3</li>
        <li>vaga4</li>
        <li>vaga5</li>
        <li>vaga6</li>
        <li>vaga7</li>
        <li>vaga8</li>
        <li>vaga9</li>
        <li>vaga10</li>
        <li>vaga11</li>
      </ul>
  </aside>
</body>
</html>
